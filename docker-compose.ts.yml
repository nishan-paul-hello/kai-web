services:
  ts-kai:
    image: tailscale/tailscale:latest
    hostname: kai
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/kai.json
    volumes:
      - ./infra/tailscale/kai.json:/config/kai.json
      - ts_kai_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      - kai-network
    restart: unless-stopped

networks:
  kai-network:
    external: true

volumes:
  ts_kai_state:
